modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId = "advancedschematicannon"
# file.jarVersion 形式の置換は moddev plugin との組み合わせで "0.0NONE" になることがあるため
# 使わない。手書きリテラルだと jar 名と宣言版がずれる(名前 1.0.6 / 宣言 1.0.5 の実例あり)ので、
# processResources が gradle.properties の mod_version をここへ展開する。
# NOTE: expand はコメント行も対象なので、この注記に置換記法そのものを書かないこと。
version = "${mod_version}"
displayName = "Advanced Schematic Cannon"
logoFile = "icon.png"
description = '''
Create Schematicannon addon: an Enhanced Schematicannon variant with AE2 ME storage integration,
AE2 auto-crafting for missing items, AE2 cable power input, and optional ProjectE EMC support.
'''
authors = "BelugaLab"

# Required Manta floor = the EMBEDDED version (${manta_version} from gradle.properties,
# expanded by processResources). With every consumer declaring [embedded,3), older embedded
# Mantas fall out of the JarJar range intersection and the newest one wins deterministically.
# 2026-08-30 correction: this used to say "this mod then runs on it via Manta's <2.0 binary
# compatibility". Manta 2.0 collapsed the public surface onto com.manta.api.** and deleted
# belugalab.**, so 1.x consumers do NOT run on 2.x - mixing one in empties the range
# intersection and NeoForge stops with an explicit error.
# Manta ships embedded in this jar, so an ASC-only install always satisfies the range.
[[dependencies.advancedschematicannon]]
modId = "manta"
type = "required"
versionRange = "[${manta_version},3)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.advancedschematicannon]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.advancedschematicannon]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.21.2)"
ordering = "NONE"
side = "BOTH"

[[dependencies.advancedschematicannon]]
modId = "create"
type = "required"
# 6.x の AllDataComponents API を使用するため、Create 6.0 以上必須
versionRange = "[6.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.advancedschematicannon]]
modId = "projecte"
type = "optional"
versionRange = "[1.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.advancedschematicannon]]
modId = "ae2"
type = "optional"
versionRange = "[19.0,)"
ordering = "AFTER"
side = "BOTH"
